<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হোমিওপ্যাথি স্মার্ট কেস টেকিং ড্যাশবোর্ড (Master Edition)</title>
    <style>
        :root {
            --primary: #0077b6;
            --secondary: #0096c7;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #212529;
            --border: #ced4da;
            --accent: #2a9d8f;
        }
        body {
            font-family: 'SolaimanLipi', 'Kalpurush', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.4;
            margin: 0;
            padding: 15px;
        }
        .main-layout {
    display: grid;
    grid-template-columns: 1fr 480px ; /* বামের ইনপুট ছোট (380px), ডানের আউটপুট বাকি পুরো জায়গা (1fr) */
    gap: 15px;
    max-width: 1550px; /* স্ক্রিনের পুরো জায়গা ব্যবহার করবে */
    margin: 0 auto;
}
        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
        }
        .form-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .output-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            position: sticky;
            top: 15px;
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        h1 { color: var(--primary); margin-top: 0; font-size: 1.6rem; }
        
        /* ------------------------------------------------------------- */
        /* সেকশন কন্ট্রোল বার (সব খুলুন / সব বন্ধ করুন) */
        /* ------------------------------------------------------------- */
        .control-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #eef2f5;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .control-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .control-btn:hover { background: var(--secondary); }

        /* ------------------------------------------------------------- */
        /* এক পেজে একর্ডিয়ন (Accordion) ইন্টারফেস স্টাইল */
        /* ------------------------------------------------------------- */
        .accordion-item {
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 10px;
            background: #fff;
            overflow: hidden;
        }
        .accordion-header {
            background: #eef2f5;
            padding: 12px 15px;
            font-weight: bold;
            color: #1d3557;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }
        .accordion-header:hover { background: #e2e8f0; }
        .accordion-header.active { background: var(--secondary); color: white; }
        .accordion-content {
            display: none; /* বাই-ডিফল্ট সব বন্ধ থাকবে */
            padding: 15px;
            border-top: 1px solid var(--border);
            background: #fafafa;
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: #cbd5e1;
            color: #334155;
        }
        .accordion-header.active .status-badge { background: #fff; color: var(--primary); }
        .status-badge.filled { background: #22c55e !important; color: white !important; }

        /* ------------------------------------------------------------- */
        /* ৩টি ইনপুট প্যাটার্ন সিএসএস */
        /* ------------------------------------------------------------- */
        /* ১. ক্লাসিক লেবেল + ড্রপডাউন/ইনপুট + মন্তব্য (inline-field) */
        .inline-field {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .inline-field label { flex: 0 0 180px; font-weight: 500; font-size: 0.9rem; margin-bottom: 0; }
        .inline-field select, .inline-field input[type="text"], .inline-field input[type="date"], .inline-field textarea {
            flex: 1; margin-bottom: 0;
        }

        /* ২. ন্যাচারাল সেন্টেন্স ফিলিং (sentence-row) */
        .sentence-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 8px 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .sentence-row span { font-weight: 500; color: #333; }
        .sentence-row select { flex: 1.5; min-width: 150px; margin-bottom: 0; }
        .sentence-row input[type="text"] { flex: 1.5; margin-bottom: 0; }

        /* ৩. ডাইনামিক ড্রপডাউন রো (dropdown-row) */
        .dropdown-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .symptom-select { flex: 2; padding: 5px; border-radius: 4px; border: 1px solid var(--border); font-family: inherit; }
        .symptom-input { flex: 2; padding: 5px 8px !important; margin-bottom: 0 !important; font-size: 0.88rem; }

        input[type="text"], input[type="date"], textarea, select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.9rem;
        }
        textarea { resize: vertical; height: 50px; }
        .field-group {
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #e2e8f0;
        }
        .sub-heading-input {
            font-weight: bold; 
            color: var(--primary); 
            background: #eef2f5; 
            border: 1px solid var(--border); 
            padding: 6px 10px; 
            border-radius: 4px; 
            width: 100%;
            margin-bottom: 10px;
        }
        .add-more-btn {
            background: #457b9d;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .remove-row-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 5px 9px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* আউটপুট প্যানেল সিএসএস */
        #live-output {
            white-space: pre-wrap;
            background: #252526;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #333;
            flex: 1;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.88rem;
            margin-bottom: 10px;
        }
        .action-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 6px;
            width: 100%;
        }
        .action-btn:hover { opacity: 0.9; }
        .reset-btn { background: #6c757d; }
        .auto-save-indicator {
            font-size: 0.8rem;
            color: #4ade80;
            text-align: right;
            margin-bottom: 5px;
            font-style: italic;
        }
.auto-save-indicator {
            font-size: 0.8rem;
            color: #4ade80;
            text-align: right;
            margin-bottom: 5px;
            font-style: italic;
        }
        
        /* --- নতুন যোগ করুন (বোতামের স্টাইল) --- */
        .accordion-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
        }
        .move-btns {
            display: flex;
            gap: 4px;
        }
        .move-btn {
            background: #cbd5e1;
            border: none;
            border-radius: 3px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #1e293b;
            transition: background 0.2s;
        }
        .move-btn:hover {
            background: #94a3b8;
            color: white;
        }
        /* ---------------------------------- */

/* নতুন ২ কলাম বা ইনলাইন গ্রিড স্টাইল (সেকশন ১ এর জন্য) */
.inline-group-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 8px;
}
@media (max-width: 768px) {
    .inline-group-container {
        grid-template-columns: 1fr;
    }
}
/* নতুন মাল্টি-কলাম এবং কমপ্যাক্ট গ্রিড স্টাইল */
.grid-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 8px;
}
.grid-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
}
@media (max-width: 768px) {
    .grid-row-2, .grid-row-3 {
        grid-template-columns: 1fr;
    }
}
.compact-field {
    display: flex;
    align-items: center;
    gap: 6px;
}
.compact-field label {
    flex: 0 0 auto;
    font-weight: 500;
    font-size: 0.88rem;
    margin-bottom: 0;
}
.compact-field input, .compact-field select {
    flex: 1;
    margin-bottom: 0;
}

    </style>
</head>
    </style>
</head>
<body>

<div class="main-layout">
    <!-- বাম পাশে: ১ পেজে একর্ডিয়নভিত্তিক সেকশনসমূহ -->
    <div class="form-container">
        <h1>হোমিওপ্যাথি ডিজিটাল কেস টেকিং ড্যাশবোর্ড</h1>
        <p style="font-size: 0.88rem; color: #64748b; margin-bottom: 10px;">
            সেকশনে ক্লিক করে তথ্য পূরণ করুন। তথ্য স্বয়ংক্রিয়ভাবে সংরক্ষিত (Auto-Save) হচ্ছে।
        </p>

        <!-- সেকশন দ্রুত নিয়ন্ত্রণ করার বার -->
        <div class="control-bar">
            <button class="control-btn" onclick="expandAllSections()">➕ সব সেকশন খুলুন</button>
            <button class="control-btn" onclick="collapseAllSections()" style="background: #6c757d;">➖ সব সেকশন বন্ধ করুন</button>
        </div>

        <div id="accordionContainer"></div>
    </div>

    <!-- ডান পাশে: ফিক্সড লাইভ আউটপুট প্যানেল -->
    <div class="output-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h2 style="color: #fff; font-size: 1.1rem; margin: 0;">লাইভ রপার্টরি সামারি</h2>
            <span class="auto-save-indicator" id="saveIndicator">✓ অটো-সেভ সক্রিয়</span>
        </div>
        <div id="live-output">এখনো কোনো তথ্য পূরণ করা হয়নি।</div>
        <button class="action-btn" onclick="copyToClipboard()">📋 কপি করুন (Copy for Obsidian)</button>
        <button class="action-btn" onclick="window.print()" style="background: #e76f51;">🖨️ পিডিএফ সেভ / প্রিন্ট করুন</button>
        <button class="action-btn reset-btn" onclick="clearAllData()">🗑️ নতুন কেস (সব ডাটা মুছুন)</button>
    </div>
</div>

<script>
  
    const sectionsData = [
        
        
        // সেকশন ০১: সাধারণ ও ব্যক্তিগত তথ্য
        // ---------------------------------------------------------------------
      {
            id: 1,
            title: "০১: সাধারণ ও ব্যক্তিগত তথ্য",
            content: `
                <!-- রোগীর মৌলিক তথ্য -->
                <div class="field-group">
                    <input type="text" class="sub-heading-input" value="রোগীর মৌলিক তথ্য" oninput="triggerAutoSave()">
                    
                    <!-- সিরিয়াল নম্বর ও তারিখ -->
                    <div class="grid-row-2">
                        <div class="inline-field" style="margin-bottom:0;">
                            <label style="flex: 0 0 110px;">সিরিয়াল নম্বর:</label>
                            <input type="text" data-key="সিরিয়াল নম্বর" oninput="triggerAutoSave()">
                        </div>
                        <div class="inline-field" style="margin-bottom:0;">
                            <label style="flex: 0 0 50px;">তারিখ:</label>
                            <input type="date" data-key="তারিখ" onchange="triggerAutoSave()">
                        </div>
                    </div>
                    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 8px 0;">

                    <!-- নাম ও মোবাইল নম্বর একই লাইনে -->
                    <div class="grid-row-2">
                        <div class="inline-field" style="margin-bottom:0;">
                            <label style="flex: 0 0 110px;">রোগীর নাম:</label>
                            <input type="text" data-key="রোগীর নাম" oninput="triggerAutoSave()">
                        </div>
                        <div class="inline-field" style="margin-bottom:0;">
                            <label style="flex: 0 0 85px;">মোবাইল নম্বর:</label>
                            <input type="text" data-key="মোবাইল নাম্বার" oninput="triggerAutoSave()">
                        </div>
                    </div>

                    <div class="inline-field" style="margin-top: 8px;">
                        <label style="flex: 0 0 110px;">ঠিকানা:</label>
                        <input type="text" data-key="ঠিকানা" oninput="triggerAutoSave()">
                    </div>

                    <!-- পেশা, বয়স, উচ্চতা, ওজন ছোট ফিল্ড হিসেবে -->
                    <div class="grid-row-2" style="margin-top: 8px;">
                        <div class="compact-field">
                            <label>পেশা:</label>
                            <input type="text" data-key="পেশা" oninput="triggerAutoSave()">
                        </div>
                        <div class="compact-field">
                            <label>বয়স:</label>
                            <input type="text" data-key="বয়স" placeholder="বছর" oninput="triggerAutoSave()">
                        </div>
                        <div class="compact-field">
                            <label>উচ্চতা:</label>
                            <input type="text" data-key="উচ্চতা" oninput="triggerAutoSave()">
                        </div>
			 <div class="compact-field">
                            <label>ওজন:</label>
                            <input type="text" data-key="ওজন" oninput="triggerAutoSave()">
                        </div>
                    </div>

                      <!--  ওজনের অতিরিক্ত লাািইন  বাদ দিতে  <div class="grid-row-2" style="margin-top: 8px;">
                        <div class="compact-field">
                            <label style="flex: 0 0 110px;">ওজন:</label>
                            <input type="text" data-key="ওজন" oninput="triggerAutoSave()">
                        </div>
                        <div></div>
                    </div>
                    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 8px 0;">  -->
                    
                    <!-- বৈবাহিক অবস্থা (মন্তব্যের ঘরসহ) -->
                    <div class="inline-field">
                        <label style="flex: 0 0 130px;">বৈবাহিক অবস্থা:</label>
                        <div style="display: flex; gap: 8px; flex: 1;">
                            <select class="symptom-select" data-key="বৈবাহিক অবস্থা" onchange="handleSelectChange(this)">
                                <option value="">-- নির্বাচন করুন --</option>
                                <option value="অবিবাহিত">অবিবাহিত</option>
                                <option value="বিবাহিত">বিবাহিত</option>
                                <option value="বিপত্নীক / বিধবা">বিপত্নীক / বিধবা</option>
                                <option value="পৃথক / ডিভোর্সড">পৃথক / ডিভোর্সড</option>
                                <option value="অন্যান্য (নিজস্ব ভাষায়)">✏️ নিজের মতো লিখুন...</option>
                            </select>
                            <input type="text" class="symptom-input" placeholder="মন্তব্য (যেমন: কত বছর...)" oninput="triggerAutoSave()">
                        </div>
                    </div>

                    <!-- গায়ের রঙ ও চুলের রঙ পাশাপাশি (কনসাইজ লুক) -->
                    <div class="grid-row-2" style="margin-top: 8px;">
                        <div class="compact-field">
                            <label style="flex: 0 0 130px;">গায়ের রঙ:</label>
                            <select class="symptom-select" data-key="গায়ের রঙ" onchange="handleSelectChange(this)">
                                <option value="">-- নির্বাচন --</option>
                                <option value="ফর্সা">ফর্সা</option>
                                <option value="শ্যামলা">শ্যামলা</option>
                                <option value="কালো">কালো</option>
                                <option value="অন্যান্য">✏️ লিখুন...</option>
                            </select>
                        </div>
                        <div class="compact-field">
                            <label style="flex: 0 0 80px;">চুলের রঙ:</label>
                            <select class="symptom-select" data-key="চুলের রঙ" onchange="handleSelectChange(this)">
                                <option value="">-- নির্বাচন --</option>
                                <option value="কালো">কালো</option>
                                <option value="বাদামী">বাদামী</option>
                                <option value="ধূসর / পাকা">ধূসর / পাকা</option>
                                <option value="অন্যান্য">✏️ লিখুন...</option>
                            </select>
                        </div>
                    </div>

                    <!-- চোখের রঙ ও শারীরিক গঠন পাশাপাশি -->
                    <div class="grid-row-2" style="margin-top: 8px;">
                        <div class="compact-field">
                            <label style="flex: 0 0 130px;">চোখের রঙ:</label>
                            <select class="symptom-select" data-key="চোখের রঙ" onchange="handleSelectChange(this)">
                                <option value="">-- নির্বাচন --</option>
                                <option value="কালো">কালো</option>
                                <option value="বাদামী">বাদামী</option>
                                <option value="নীল">নীল</option>
                                <option value="অন্যান্য">✏️ লিখুন...</option>
                            </select>
                        </div>
                        <div class="compact-field">
                            <label style="flex: 0 0 80px;">গঠন:</label>
                            <select class="symptom-select" data-key="শারীরিক গঠন" onchange="handleSelectChange(this)">
                                <option value="">-- নির্বাচন --</option>
                                <option value="খাটো / বেঁটে">খাটো</option>
                                <option value="মাঝারি">মাঝারি</option>
                                <option value="লম্বা">লম্বা</option>
                                <option value="কৃশ / রোগা">কৃশ</option>
                                <option value="স্থূলকায় / মোটা">স্থূলকায়</option>
                                <option value="অন্যান্য">✏️ লিখুন...</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- বর্তমান কষ্টের বিবরণ বাদ
                <div class="field-group">
                    <input type="text" class="sub-heading-input" value="বর্তমান কষ্টের বিবরণ" oninput="triggerAutoSave()">

    document.addEventListener("DOMContentLoaded", () => {
        renderAccordion();
        loadSavedData();
        updateLiveOutput();
    });

    function renderAccordion() {
        const container = document.getElementById("accordionContainer");
        container.innerHTML = "";

        sectionsData.forEach((sec) => {
            const item = document.createElement("div");
            item.className = "accordion-item";
            item.id = `sec-item-${sec.id}`;

            // বাই-ডিফল্ট display: none (কোনো সেকশন খোলা থাকবে না)
            item.innerHTML = `
                <div class="accordion-header" onclick="toggleAccordion(${sec.id})">
                    <span>${sec.title}</span>
                    <span class="status-badge" id="badge-${sec.id}">খালি</span>
                </div>
                <div class="accordion-content" id="content-${sec.id}" style="display: none;">
                    ${sec.content}
                </div>
            `;
            container.appendChild(item);
        });
    }

    function toggleAccordion(secId) {
        const content = document.getElementById(`content-${secId}`);
        const header = document.querySelector(`#sec-item-${secId} .accordion-header`);
        const isOpen = content.style.display === "block";

        content.style.display = isOpen ? "none" : "block";
        if (isOpen) {
            header.classList.remove("active");
        } else {
            header.classList.add("active");
        }
    }

    // সব সেকশন একসাথে খোলার ফাংশন
    function expandAllSections() {
        sectionsData.forEach(sec => {
            const content = document.getElementById(`content-${sec.id}`);
            const header = document.querySelector(`#sec-item-${sec.id} .accordion-header`);
            if (content && header) {
                content.style.display = "block";
                header.classList.add("active");
            }
        });
    }

    // সব সেকশন একসাথে বন্ধ করার ফাংশন
    function collapseAllSections() {
        sectionsData.forEach(sec => {
            const content = document.getElementById(`content-${sec.id}`);
            const header = document.querySelector(`#sec-item-${sec.id} .accordion-header`);
            if (content && header) {
                content.style.display = "none";
                header.classList.remove("active");
            }
        });
    }

    function handleSelectChange(selectEl) {
        const inputEl = selectEl.parentElement.querySelector('.symptom-input');
        if (selectEl.value === "অন্যান্য (নিজস্ব ভাষায়)" && inputEl) {
            inputEl.focus();
            inputEl.placeholder = "এখানে আপনার নিজের মতো করে লিখুন...";
        }
        triggerAutoSave();
    }

    // =========================================================================
    // অটো-সেভ (LocalStorage) ও আউটপুট ইঞ্জিন
    // =========================================================================
    function triggerAutoSave() {
        saveAllData();
        updateLiveOutput();
        showSaveIndicator();
    }

    function showSaveIndicator() {
        const ind = document.getElementById("saveIndicator");
        ind.innerText = "⏳ সেভ হচ্ছে...";
        setTimeout(() => { ind.innerText = "✓ অটো-সেভ সংরক্ষিত"; }, 400);
    }

    function saveAllData() {
        const formData = {};
        document.querySelectorAll("input, select, textarea").forEach((el, index) => {
            if (el.id || el.getAttribute("data-key") || el.className) {
                const key = el.id || `field_${index}`;
                formData[key] = el.value;
            }
        });
        localStorage.setItem("homeo_dashboard_data", JSON.stringify(formData));
    }

    function loadSavedData() {
        const saved = localStorage.getItem("homeo_dashboard_data");
        if (!saved) return;
        const formData = JSON.parse(saved);

        document.querySelectorAll("input, select, textarea").forEach((el, index) => {
            const key = el.id || `field_${index}`;
            if (formData[key] !== undefined) {
                el.value = formData[key];
            }
        });
    }

    function clearAllData() {
        if (confirm("আপনি কি নতুন কেস শুরু করতে চান? বর্তমান সব ডাটা মুছে যাবে।")) {
            localStorage.removeItem("homeo_dashboard_data");
            document.querySelectorAll("input, select, textarea").forEach(el => {
                if(!el.classList.contains("sub-heading-input")) el.value = "";
            });
            updateLiveOutput();
            alert("সব ডাটা রিসেট করা হয়েছে!");
        }
    }

    function updateLiveOutput() {
        let output = "=== হোমিওপ্যাথিক কেস টেকিং ও রপার্টরি সামারি ===\n\n";
        let dataMap = {};

        sectionsData.forEach(sec => {
            const secContent = document.getElementById(`content-${sec.id}`);
            if (!secContent) return;

            let secHasData = false;
            const fieldGroups = secContent.querySelectorAll(".field-group");

            fieldGroups.forEach(group => {
                let headingInput = group.querySelector(".sub-heading-input");
                let groupTitle = headingInput && headingInput.value.trim() !== "" ? headingInput.value.trim() : "সাধারণ লক্ষণ";

                if (!dataMap[groupTitle]) dataMap[groupTitle] = [];

                // ১. ক্লাসিক ইনলাইন স্ক্যান
                group.querySelectorAll(".inline-field").forEach(field => {
                    let labelEl = field.querySelector("label");
                    let selectEl = field.querySelector("select");
                    let mainInput = field.querySelector("input[data-key], textarea[data-key]");
                    let commentInput = field.querySelector(".symptom-input");

                    let labelText = labelEl ? labelEl.innerText.replace(":", "").trim() : "";
                    let selectVal = selectEl && selectEl.selectedIndex > 0 ? selectEl.options[selectEl.selectedIndex].text : "";
                    let inputVal = mainInput ? mainInput.value.trim() : "";
                    let commentVal = commentInput && commentInput.value.trim() !== "" ? " (মন্তব্য: " + commentInput.value.trim() + ")" : "";

                    let finalVal = selectVal === "✏️ নিজের মতো লিখুন..." ? "" : (selectVal || inputVal);

                    if (finalVal !== "" || commentVal !== "") {
                        dataMap[groupTitle].push(`${labelText}: ${finalVal}${commentVal}`);
                        secHasData = true;
                    }
                });

                // ২. ন্যাচারাল সেন্টেন্স স্ক্যান
                group.querySelectorAll(".sentence-row").forEach(row => {
                    let textSpans = row.querySelectorAll("span");
                    let selectEl = row.querySelector("select");
                    let commentInput = row.querySelector(".symptom-input");

                    let prefix = textSpans.length > 0 ? textSpans[0].innerText : "";
                    let selectVal = selectEl && selectEl.selectedIndex > 0 ? selectEl.options[selectEl.selectedIndex].text : "";
                    let suffix = textSpans.length > 1 ? textSpans[1].innerText : "";
                    let commentVal = commentInput && commentInput.value.trim() !== "" ? " (মন্তব্য: " + commentInput.value.trim() + ")" : "";

                    if (selectVal !== "") {
                        let finalVal = selectVal === "✏️ নিজের মতো লিখুন..." ? "" : selectVal;
                        dataMap[groupTitle].push(`${prefix} ${finalVal} ${suffix}${commentVal}`.trim());
                        secHasData = true;
                    }
                });

                // ৩. ডাইনামিক ড্রপডাউন রো স্ক্যান
                group.querySelectorAll(".dropdown-row").forEach(row => {
                    let selectEl = row.querySelector(".symptom-select");
                    let commentInput = row.querySelector(".symptom-input");

                    let selectVal = selectEl && selectEl.selectedIndex > 0 ? selectEl.options[selectEl.selectedIndex].text : "";
                    let commentVal = commentInput && commentInput.value.trim() !== "" ? " - " + commentInput.value.trim() : "";

                    if (selectVal !== "") {
                        let finalVal = selectVal === "✏️ নিজের মতো লিখুন..." ? "" : selectVal;
                        dataMap[groupTitle].push(`${finalVal}${commentVal}`);
                        secHasData = true;
                    }
                });
            });

            // সেকশন ব্যাজ আপডেট (খালি নাকি পূরণ)
            const badge = document.getElementById(`badge-${sec.id}`);
            if (badge) {
                if (secHasData) {
                    badge.innerText = "✓ তথ্য আছে";
                    badge.classList.add("filled");
                } else {
                    badge.innerText = "খালি";
                    badge.classList.remove("filled");
                }
            }
        });

        let hasContent = false;
        for (let group in dataMap) {
            if (dataMap[group].length > 0) {
                hasContent = true;
                output += `▶ [ ${group} ]\n`;
                dataMap[group].forEach(item => { output += `   • ${item}\n`; });
                output += `\n`;
            }
        }

        document.getElementById("live-output").innerText = hasContent ? output : "এখনো কোনো তথ্য পূরণ করা হয়নি।";
    }
